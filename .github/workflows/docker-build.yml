name: Build Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            # Initial push — build every service that has a Dockerfile
            SERVICES=$(find . -mindepth 2 -maxdepth 2 -name Dockerfile \
              | xargs -I{} dirname {} \
              | sed 's|^\./||' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
            exit 0
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          SERVICES=$(git diff --name-only "$BASE" "$HEAD" \
            | grep '/' \
            | cut -d/ -f1 \
            | sort -u \
            | while IFS= read -r dir; do
                [[ -f "$dir/Dockerfile" ]] && echo "$dir"
              done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: docker.io/xarthisius/${{ matrix.service }}-consumer:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
